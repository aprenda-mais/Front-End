<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
    <link rel="stylesheet" href="../assets/css/pages/cadastro.css">
</head>

<body>

    <header class="top">
        <span class="icon-top"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M2 21.0004C1.99992 19.4608 2.44413 17.9538 3.27935 16.6603C4.11456 15.3669 5.30527 14.3419 6.7086 13.7085C8.11193 13.075 9.66824 12.8599 11.1908 13.0891C12.7133 13.3183 14.1373 13.9819 15.292 15.0004" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 13C12.7614 13 15 10.7614 15 8C15 5.23858 12.7614 3 10 3C7.23858 3 5 5.23858 5 8C5 10.7614 7.23858 13 10 13Z" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 16V22" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 19H16" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>Cadastro</span>
    </header>

    <main class="container-form">
        <section class="introducao">
            <h1 class="title-form">Crie sua conta</h1>
            <p class="subtitle">
                Pequenos hábitos, mais cuidado com você.<br>
                Comece no seu ritmo.
            </p>
        </section>

        <form id="authForm" class="formulario">
            <div class="fields">
            <div class="campo">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Seu nome completo"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
                <small>Use pelo menos 8 caracteres.</small>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    name="confirmarSenha"
                    placeholder="Digite sua senha novamente"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>
            </div>

            <div class="termos">
                <input
                    type="checkbox"
                    id="aceitarTermos"
                    name="aceitarTermos"
                    required
                >

                <label for="aceitarTermos">
                    Li e aceito os
                    <a href="#termos">Termos de uso</a>
                    e a
                    <a href="#privacidade">Política de privacidade</a>.
                </label>
            </div>

            <button type="submit" onclick="window.location.href='./habito_ancora.html'"  class="btn-task btn-principal" >
                Criar conta
            </button>


            <p class="alternativa">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </form>

    </main>
<script src="assets/js/login.js"></script>
</body>
</html>
