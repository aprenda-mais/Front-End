<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in: Micro-ações</title>
  <link rel="stylesheet" href="../assets/css/pages/checkin-tarefas.css">
</head>
<body>

  <!-- Topo -->
  <header class="top">
    <span class="icon-top">
      <svg xmlns="http://www.w3.org/2000/svg" width="21" height="20" viewBox="0 0 21 20" fill="none">
  <path d="M0 10L7.14286 20L20 0" stroke="#133826" stroke-width="1.8" stroke-linecap="round"/>
</svg>
      micro-ações de hoje
    </span>
  </header>

  <!-- Conteúdo Central -->
  <main class="container-form card-form">
    <div class="introducao">
      <h1 class="title-form">O que você conseguiu praticar?</h1>
      <p class="subtitle">
        Deixamos todas marcadas para facilitar.<br>
        Desmarque apenas o que não foi possível hoje.
      </p>
    </div>

    <!-- Grelha de Ações (Checkboxes) -->
    <div class="cards-grid">
      
      <!-- 1. 2 min longe de telas no café -->
      <label class="card-item ">
        <input type="checkbox" name="habito" value="cafe" class="action-input" checked>
        <div class="card-option card-task-form">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-card">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M10 2V4M14 2V4M16 8C16.2652 8 16.5196 8.10536 16.7071 8.29289C16.8946 8.48043 17 8.73478 17 9V17C17 18.0609 16.5786 19.0783 15.8284 19.8284C15.0783 20.5786 14.0609 21 13 21H7C5.93913 21 4.92172 20.5786 4.17157 19.8284C3.42143 19.0783 3 18.0609 3 17V9C3 8.73478 3.10536 8.48043 3.29289 8.29289C3.48043 8.10536 3.73478 8 4 8H18C19.0609 8 20.0783 8.42143 20.8284 9.17157C21.5786 9.92172 22 10.9391 22 12C22 13.0609 21.5786 14.0783 20.8284 14.8284C20.0783 15.5786 19.0609 16 18 16H17M6 2V4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <h3>2 min longe de telas no café</h3>
        </div>
      </label>

      <!-- 2. 1 copo d'água ao despertar -->
      <label class="card-item">
        <input type="checkbox" name="habito" value="agua" class="action-input" checked>
        <div class="card-option card-task-form">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-card">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M5.99939 12.0004C6.86498 11.3512 7.91779 11.0003 8.99979 11.0003C10.0818 11.0003 11.1346 11.3512 12.0002 12.0004C12.8658 12.6495 13.9186 13.0004 15.0006 13.0004C16.0826 13.0004 17.1354 12.6495 18.001 12.0004M5.11504 4.10404C5.10048 3.96475 5.11533 3.82395 5.15865 3.69077C5.20196 3.55758 5.27277 3.43498 5.36649 3.3309C5.46021 3.22682 5.57475 3.14358 5.70269 3.08658C5.83063 3.02958 5.96911 3.00008 6.10918 3H17.8908C18.0309 3.00007 18.1695 3.02959 18.2975 3.08665C18.4255 3.14371 18.5401 3.22704 18.6338 3.33123C18.7276 3.43543 18.7984 3.55816 18.8416 3.69146C18.8849 3.82477 18.8996 3.96567 18.8849 4.10504L17.1907 20.2107C17.1388 20.7022 16.9067 21.1572 16.5391 21.4877C16.1716 21.8183 15.6947 22.001 15.2004 22.0008H8.79954C8.30349 22.0035 7.82413 21.8219 7.4545 21.4911C7.08487 21.1603 6.85135 20.704 6.79927 20.2107L5.11504 4.10404Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <h3>1 copo d'água ao despertar</h3>
        </div>
      </label>

      <!-- 3. Pausa de respiração de 60s -->
      <label class="card-item">
        <input type="checkbox" name="habito" value="respiracao" class="action-input" checked>
        <div class="card-option card-task-form">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M12 3V11M9 11L12 7L15 11M9 7C7 4 3 9 3 16C3 20 9 21 9 17V7ZM15 7C17 4 21 9 21 16C21 20 15 21 15 17V7Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
          </div>
          <h3>Pausa de respiração de 60s</h3>
        </div>
      </label>

      <!-- 4. Alongamento ao fechar o laptop -->
      <label class="card-item">
        <input type="checkbox" name="habito" value="laptop" class="action-input" checked>
        <div class="card-option card-task-form">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M18 5C18.5305 5 19.0392 5.21071 19.4142 5.58579C19.7893 5.96086 20 6.46957 20 7V15.526C19.9999 15.8374 20.0725 16.1446 20.212 16.423L21.28 18.55C21.3571 18.703 21.3936 18.8732 21.386 19.0444C21.3784 19.2155 21.327 19.3818 21.2366 19.5274C21.1463 19.6729 21.0201 19.7928 20.8701 19.8756C20.7201 19.9584 20.5513 20.0012 20.38 20H3.62002C3.44871 20.0012 3.27997 19.9584 3.12997 19.8756C2.97997 19.7928 2.85374 19.6729 2.7634 19.5274C2.67305 19.3818 2.62162 19.2155 2.61402 19.0444C2.60643 18.8732 2.64293 18.703 2.72002 18.55L3.78802 16.423C3.92756 16.1446 4.00016 15.8374 4.00002 15.526V7C4.00002 6.46957 4.21073 5.96086 4.58581 5.58579C4.96088 5.21071 5.46959 5 6.00002 5H18Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20.054 15.9863H3.94604" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
          </div>
          <h3>Alongamento ao fechar o laptop</h3>
        </div>
      </label>

      <!-- 5. Luz baixa antes de deitar -->
      <label class="card-item">
        <input type="checkbox" name="habito" value="luz" class="action-input" checked>
        <div class="card-option card-task-form">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M1.99915 4V19.9984M1.99915 7.9996H20.0006C20.5311 7.9996 21.0398 8.21029 21.4149 8.58533C21.79 8.96036 22.0007 9.46902 22.0007 9.9994V19.9984M1.99915 16.9987H22.0007M5.99947 7.9996V16.9987" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <h3>Luz baixa antes de deitar</h3>
        </div>
      </label>

      <!-- 6. Esvaziar a mente no papel -->
      <label class="card-item">
        <input type="checkbox" name="habito" value="papel" class="action-input" checked>
        <div class="card-option card-task-form">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M15.0003 4.99995L19.0007 8.99988M21.1748 6.8123C21.7035 6.28373 22.0007 5.56679 22.0007 4.81919C22.0008 4.07159 21.7039 3.35457 21.1753 2.82587C20.6467 2.29717 19.9296 2.00009 19.182 2C18.4343 1.99991 17.7172 2.2968 17.1884 2.82537L3.84124 16.1741C3.60904 16.4056 3.43732 16.6907 3.3412 17.0041L2.02008 21.356C1.99423 21.4425 1.99228 21.5344 2.01443 21.6219C2.03658 21.7094 2.08201 21.7893 2.14589 21.853C2.20977 21.9168 2.28973 21.9621 2.37727 21.9841C2.46482 22.0061 2.55669 22.004 2.64314 21.978L6.99653 20.6581C7.30972 20.5628 7.59475 20.3922 7.8266 20.1611L21.1748 6.8123Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <h3>Esvaziar a mente no papel</h3>
        </div>
      </label>

    </div>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <a href="checkin_sentimento.html" class="btn-hero btn-form-card">
      Confirmar hábitos
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </footer>

</body>
</html>
