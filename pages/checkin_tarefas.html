<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in: Micro-ações</title>
  <link rel="stylesheet" href="../assets/css/checkin_tarefas.css">
</head>
<body>

  <!-- Topo -->
  <header class="header-top">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>micro-ações de hoje</span>
    </div>
  </header>

  <!-- Conteúdo Central -->
  <main class="main-container">
    <div class="title-group">
      <h1 class="page-title">O que você conseguiu praticar?</h1>
      <p class="page-subtitle">
        Deixamos todas marcadas para facilitar.<br>
        Desmarque apenas o que não foi possível hoje.
      </p>
    </div>

    <!-- Grelha de Ações (Checkboxes) -->
    <form class="actions-grid">
      
      <!-- 1. 2 min longe de telas no café -->
      <label class="action-item">
        <input type="checkbox" name="habito" value="cafe" class="action-input" checked>
        <div class="action-card">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 8h1a3 3 0 0 1 0 6h-1"></path>
              <path d="M4 8h13v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8Z"></path>
              <path d="M8 3v2M12 3v2M16 3v2"></path>
            </svg>
          </div>
          <h3>2 min longe de telas no café</h3>
        </div>
      </label>

      <!-- 2. 1 copo d'água ao despertar -->
      <label class="action-item">
        <input type="checkbox" name="habito" value="agua" class="action-input" checked>
        <div class="action-card">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12l-1.5 17a2 2 0 0 1-2 1.8H9.5a2 2 0 0 1-2-1.8L6 3Z"></path>
              <line x1="6" y1="8" x2="18" y2="8"></line>
            </svg>
          </div>
          <h3>1 copo d'água ao despertar</h3>
        </div>
      </label>

      <!-- 3. Pausa de respiração de 60s -->
      <label class="action-item">
        <input type="checkbox" name="habito" value="respiracao" class="action-input" checked>
        <div class="action-card">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="9" cy="12" rx="2.5" ry="5.5"></ellipse>
              <ellipse cx="15" cy="12" rx="2.5" ry="5.5"></ellipse>
            </svg>
          </div>
          <h3>Pausa de respiração de 60s</h3>
        </div>
      </label>

      <!-- 4. Alongamento ao fechar o laptop -->
      <label class="action-item">
        <input type="checkbox" name="habito" value="laptop" class="action-input" checked>
        <div class="action-card">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m8 6 9-2 2 9-9 2z"></path>
              <path d="M4 19h16a1 1 0 0 0 1-1v-1H3v1a1 1 0 0 0 1 1Z"></path>
            </svg>
          </div>
          <h3>Alongamento ao fechar o laptop</h3>
        </div>
      </label>

      <!-- 5. Luz baixa antes de deitar -->
      <label class="action-item">
        <input type="checkbox" name="habito" value="luz" class="action-input" checked>
        <div class="action-card">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 19V9M21 19v-5"></path>
              <path d="M3 15h18v4H3z"></path>
              <path d="M7 11h4a2 2 0 0 1 2 2v2H5v-2a2 2 0 0 1 2-2Z"></path>
            </svg>
          </div>
          <h3>Luz baixa antes de deitar</h3>
        </div>
      </label>

      <!-- 6. Esvaziar a mente no papel -->
      <label class="action-item">
        <input type="checkbox" name="habito" value="papel" class="action-input" checked>
        <div class="action-card">
          <span class="pill-done">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Feito
          </span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </div>
          <h3>Esvaziar a mente no papel</h3>
        </div>
      </label>

    </form>
  </main>

  <!-- Rodapé -->
  <footer class="footer-bar">
    <a href="checkin_sentimento.html" class="btn-confirm">
      Confirmar hábitos
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </footer>

</body>
</html>
