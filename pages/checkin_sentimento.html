<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in: Sentimento</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../assets/css/base/variables.css">
  <link rel="stylesheet" href="../assets/css/pages/checkin-sentimento.css">
</head>
<body>

  <!-- Topo -->
  <header class="header-top">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <circle cx="12" cy="12" r="2.5"></circle>
      </svg>
      <span>escuta interna</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">
    <div class="title-group">
      <h1 class="page-title">Como você se sente agora?</h1>
      <p class="page-subtitle">Registrar sua sensação ajuda a calibrar o ritmo dos próximos dias.</p>
    </div>

    <!-- Grelha de 6 Sentimentos -->
    <form class="actions-grid">
      
      <!-- 1. Alívio & Leveza (Selecionado por padrão) -->
      <label class="action-item">
        <input type="radio" name="sentimento" value="alivio" class="action-input" checked>
        <div class="action-card">
          <span class="radio-dot"></span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
          </div>
          <h3>Alívio &amp; Leveza</h3>
        </div>
      </label>

      <!-- 2. Mais disposição -->
      <label class="action-item">
        <input type="radio" name="sentimento" value="disposicao" class="action-input">
        <div class="action-card">
          <span class="radio-dot"></span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 6H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path>
              <path d="M17 6h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"></path>
              <path d="m13 8-3 4h4l-2 4"></path>
            </svg>
          </div>
          <h3>Mais disposição</h3>
        </div>
      </label>

      <!-- 3. Neutro / Sem mudança -->
      <label class="action-item">
        <input type="radio" name="sentimento" value="neutro" class="action-input">
        <div class="action-card">
          <span class="radio-dot"></span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="14" x2="16" y2="14"></line>
              <line x1="9" y1="9" x2="9.01" y2="9"></line>
              <line x1="15" y1="9" x2="15.01" y2="9"></line>
            </svg>
          </div>
          <h3>Neutro / Sem mudança</h3>
        </div>
      </label>

      <!-- 4. Ainda cansado(a) -->
      <label class="action-item">
        <input type="radio" name="sentimento" value="cansado" class="action-input">
        <div class="action-card">
          <span class="radio-dot"></span>
          <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="26" viewBox="0 0 28 26" fill="none">
  <path d="M16.8936 1.57989C14.5168 0.744798 11.9374 0.677724 9.52038 1.38816C7.10336 2.0986 4.97116 3.55057 3.42554 5.53858C1.87991 7.5266 0.99914 9.94996 0.907879 12.4657C0.816617 14.9815 1.51949 17.4622 2.91701 19.5568C4.31454 21.6514 6.33594 23.2538 8.69514 24.1372C11.0543 25.0206 13.6318 25.1403 16.0629 24.4794C18.4939 23.8184 20.6553 22.4103 22.2413 20.4542C23.8272 18.4981 24.7573 16.0933 24.9 13.5799M4.88394 12.2466C6.21834 14.0243 7.55275 14.0243 8.88715 12.2466M12.8904 12.2466C14.2248 14.0243 15.5592 14.0243 16.8936 12.2466M8.88715 18.9132H14.2248M19.5624 1.57989H24.9L19.5624 6.91323H24.9" stroke-width="2.4" stroke-linecap="round"/>
</svg>
          </div>
          <h3>Ainda cansado(a)</h3>
        </div>
      </label>

      <!-- 5. Foco renovado -->
      <label class="action-item">
        <input type="radio" name="sentimento" value="foco" class="action-input">
        <div class="action-card">
          <span class="radio-dot"></span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="2.5"></circle>
              <line x1="12" y1="7.5" x2="12" y2="21"></line>
              <line x1="8" y1="11" x2="16" y2="11"></line>
              <path d="M5 14a7 7 0 0 0 14 0"></path>
            </svg>
          </div>
          <h3>Foco renovado</h3>
        </div>
      </label>

      <!-- 6. Acolhido(a) -->
      <label class="action-item">
        <input type="radio" name="sentimento" value="acolhido" class="action-input">
        <div class="action-card">
          <span class="radio-dot"></span>
          <div class="icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </div>
          <h3>Acolhido(a)</h3>
        </div>
      </label>

    </form>
  </main>

  <!-- Rodapé -->
  <footer class="footer-bar">
    <button type="submit" class="btn-confirm btn-finalizar" onclick="window.location.href='final_checkin.html'">
      Finalizar check-in
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>
  </footer>

</body>
</html>
