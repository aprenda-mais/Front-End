<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <link rel="stylesheet" href="../assets/css/base/variables.css">
    <link rel="stylesheet" href="../assets/css/pages/login.css">
    <script src="script.js" defer></script>
</head>

<body class="pagina-login">
    <header class="topo">
        <span class="icone-topo">♙</span>
        <span>Login</span>
    </header>

    <main class="container">

        <section class="introducao">
            <h1>Entre na sua conta</h1>
            <p>Continue sua jornada</p>
        </section>

        <form id="authForm" class="formulario">

            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="botao-principal" onclick="window.location.href='home.html'">
                Entrar
            </button>

            <p id="authNotice" class="aviso" aria-live="polite"></p>

            <p class="alternativa">
                Não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </form>

    </main>

</body>
</html>
