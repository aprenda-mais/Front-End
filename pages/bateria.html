<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in: Bateria - Ritmo de Hoje</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="stylesheet" href="../assets/css/pages/bateria.css">
</head>
<body>

  <!-- Topo -->
  <header class="top">
    <span class="icon-top">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2D4A3E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="16" height="10" rx="2" ry="2"></rect>
        <line x1="22" y1="11" x2="22" y2="13"></line>
        <line x1="6" y1="11" x2="6" y2="13"></line>
        <line x1="10" y1="11" x2="10" y2="13"></line>
      </svg>
      ritmo de hoje
    </span>
  </header>

  <!-- Conteúdo Principal -->
  <main class="container-form card-form">
    <div class="introducao">
      <h1 class="title-form">Como está sua bateria hoje?</h1>
      <p class="subtitle">Adaptamos o peso do dia ao que você tem de energia real.</p>
    </div>

    <div class="cards-grid trail">
      <!-- 1. Ritmo Normal -->
      <label class="card-item" for="ritmo-normal">
        <input type="radio" id="ritmo-normal" name="bateria" value="normal" class="battery-input">
        <div class="card-option card-option-text">
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" fill="none">
<path d="M10.8334 10.8333V15.1667M15.1671 10.8333V15.1667M23.8344 15.1667V10.8333M6.4997 10.8333V15.1667M4.33286 6.5H17.3339C18.5306 6.5 19.5007 7.47005 19.5007 8.66667V17.3333C19.5007 18.53 18.5306 19.5 17.3339 19.5H4.33286C3.13614 19.5 2.16602 18.53 2.16602 17.3333V8.66667C2.16602 7.47005 3.13614 6.5 4.33286 6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <div class="text">
          <h3>Ritmo Normal</h3>
          <p>Disposição para seguir as micro-ações padrão de 2 minutos.</p>
            </div>
        </div>
      </label>

      <!-- 2. Bateria Fraca (Selecionado por padrão) -->
      <label class="card-item" for="bateria-fraca">
        <input type="radio" id="bateria-fraca" name="bateria" value="fraca" class="battery-input" checked>
        <div class="card-option card-option-text">
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" fill="none">
  <path d="M23.8344 15.1667V10.8333M6.4997 15.1667V10.8333M4.33286 6.5H17.3339C18.5306 6.5 19.5007 7.47005 19.5007 8.66667V17.3333C19.5007 18.53 18.5306 19.5 17.3339 19.5H4.33286C3.13614 19.5 2.16602 18.53 2.16602 17.3333V8.66667C2.16602 7.47005 3.13614 6.5 4.33286 6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <div class="text">
          <h3>Bateria Fraca</h3>
          <p>Modo acolhimento. Pausas mínimas de 1 minuto, sem qualquer cobrança.</p>
        </div>
        </div>
      </label>

      <!-- 3. Apenas Respirar -->
      <label class="battery-item" for="apenas-respirar">
        <input type="radio" id="apenas-respirar" name="bateria" value="respirar" class="battery-input">
        <div class="card-option card-option-text">
          <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26" fill="none">
<path d="M9.75022 20.5844H18.959C20.252 20.5844 21.492 20.0707 22.4063 19.1564C23.3206 18.2421 23.8343 17.0019 23.8343 15.7089C23.8343 14.4158 23.3206 13.1757 22.4063 12.2613C21.492 11.347 20.252 10.8333 18.959 10.8333H17.0198C16.6179 9.48546 15.8492 8.27591 14.7996 7.33981C13.75 6.40371 12.4607 5.77795 11.0759 5.53245C9.69112 5.28695 8.26534 5.43138 6.9579 5.9496C5.65047 6.46783 4.51288 7.33943 3.67226 8.46701C2.83164 9.59459 2.3211 10.9337 2.19771 12.3348C2.07431 13.7358 2.34291 15.1436 2.9735 16.4008C3.60408 17.6579 4.57181 18.715 5.76853 19.4538C6.96526 20.1926 8.34384 20.5841 9.75022 20.5844Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
          </div>
          <div class="text">
          <h3>Apenas Respirar</h3>
          <p>Energia zero. Apenas registre presença e descanse.</p>
        </div>
        </div>
      </label>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="footer">
    <button type="button" class="btn-hero btn-form-card" onclick="window.location.href='microlearning.html'">

    Continuar

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </footer>

</body>
</html>
