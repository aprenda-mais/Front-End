<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha inicial</title>
  <link rel="stylesheet" href="../assets/css/trilha_inicial.css">
</head>
<body>

  <!-- Topo -->
  <header class="header-topo">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2D5B46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="2.5"></circle>
        <line x1="12" y1="7.5" x2="12" y2="21"></line>
        <line x1="8" y1="10.5" x2="16" y2="10.5"></line>
        <path d="M5 14a7 7 0 0 0 14 0"></path>
      </svg>
      <span>Trilha inicial</span>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="page-container">
    <h1 class="page-title">Escolha um trilha para começar</h1>

    <div class="trilhas-grid">

      <!-- Card 1: Higiene do sono -->
      <label class="card-item">
        <input type="radio" name="trilha" value="sono" checked>
        <div class="task-card">
          <div class="task-card-content">
            <div class="header-card">
              <span class="task-pill-header">2 min/dia</span>
              <span class="task-pill-header">3 micro-ações</span>
            </div>
            <h3 class="task-title">Higiene do sono</h3>
            <a href="#" class="btn-task">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M5 5.0001C4.9999 4.6482 5.09265 4.30249 5.26888 3.99789C5.44512 3.6933 5.69861 3.44059 6.00375 3.2653C6.30889 3.09001 6.65488 2.99833 7.00679 2.99952C7.3587 3.00072 7.70406 3.09474 8.008 3.2721L20.005 10.2701C20.3078 10.4458 20.5591 10.6978 20.7339 11.0011C20.9088 11.3044 21.0009 11.6482 21.0012 11.9982C21.0015 12.3483 20.91 12.6923 20.7357 12.9958C20.5614 13.2994 20.3105 13.5519 20.008 13.7281L8.008 20.7281C7.70406 20.9055 7.3587 20.9995 7.00679 21.0007C6.65488 21.0019 6.30889 20.9102 6.00375 20.7349C5.69861 20.5596 5.44512 20.3069 5.26888 20.0023C5.09265 19.6977 4.9999 19.352 5 19.0001V5.0001Z" fill="#2D5B46" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Inicie
            </a>
            <div class="footer-card">
              <p class="task-description">
                Desperte no seu ritmo.<br />Um gatilho simples de 2 min.
              </p>
              <div class="task-pills">
                <span class="task-pill-footer">Ritual matinal</span>
                <span class="task-pill-footer">Consistência</span>
                <span class="task-pill-footer">Menos estresse</span>
              </div>
            </div>
          </div>
        </div>
      </label>

      <!-- Card 2: Alimentação -->
      <label class="card-item">
        <input type="radio" name="trilha" value="alimentacao">
        <div class="task-card">
          <div class="task-card-content">
            <div class="header-card">
              <span class="task-pill-header">2 min/dia</span>
              <span class="task-pill-header">3 micro-ações</span>
            </div>
            <h3 class="task-title">Alimentação</h3>
            <a href="#" class="btn-task">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M5 5.0001C4.9999 4.6482 5.09265 4.30249 5.26888 3.99789C5.44512 3.6933 5.69861 3.44059 6.00375 3.2653C6.30889 3.09001 6.65488 2.99833 7.00679 2.99952C7.3587 3.00072 7.70406 3.09474 8.008 3.2721L20.005 10.2701C20.3078 10.4458 20.5591 10.6978 20.7339 11.0011C20.9088 11.3044 21.0009 11.6482 21.0012 11.9982C21.0015 12.3483 20.91 12.6923 20.7357 12.9958C20.5614 13.2994 20.3105 13.5519 20.008 13.7281L8.008 20.7281C7.70406 20.9055 7.3587 20.9995 7.00679 21.0007C6.65488 21.0019 6.30889 20.9102 6.00375 20.7349C5.69861 20.5596 5.44512 20.3069 5.26888 20.0023C5.09265 19.6977 4.9999 19.352 5 19.0001V5.0001Z" fill="#2D5B46" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Inicie
            </a>
            <div class="footer-card">
              <p class="task-description">
                Nutra seu corpo no seu ritmo.<br />Um hábito simples de 2 min.
              </p>
              <div class="task-pills">
                <span class="task-pill-footer">Equilíbrio</span>
                <span class="task-pill-footer">Consistência</span>
                <span class="task-pill-footer">Mais energia</span>
              </div>
            </div>
          </div>
        </div>
      </label>

      <!-- Card 3: Saúde mental -->
      <label class="card-item">
        <input type="radio" name="trilha" value="saude_mental">
        <div class="task-card">
          <div class="task-card-content">
            <div class="header-card">
              <span class="task-pill-header">2 min/dia</span>
              <span class="task-pill-header">3 micro-ações</span>
            </div>
            <h3 class="task-title">Saúde mental</h3>
            <a href="#" class="btn-task">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M5 5.0001C4.9999 4.6482 5.09265 4.30249 5.26888 3.99789C5.44512 3.6933 5.69861 3.44059 6.00375 3.2653C6.30889 3.09001 6.65488 2.99833 7.00679 2.99952C7.3587 3.00072 7.70406 3.09474 8.008 3.2721L20.005 10.2701C20.3078 10.4458 20.5591 10.6978 20.7339 11.0011C20.9088 11.3044 21.0009 11.6482 21.0012 11.9982C21.0015 12.3483 20.91 12.6923 20.7357 12.9958C20.5614 13.2994 20.3105 13.5519 20.008 13.7281L8.008 20.7281C7.70406 20.9055 7.3587 20.9995 7.00679 21.0007C6.65488 21.0019 6.30889 20.9102 6.00375 20.7349C5.69861 20.5596 5.44512 20.3069 5.26888 20.0023C5.09265 19.6977 4.9999 19.352 5 19.0001V5.0001Z" fill="#2D5B46" stroke="#2D5B46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Inicie
            </a>
            <div class="footer-card">
              <p class="task-description">
                Desacelere no seu ritmo.<br />Uma pausa simples de 2 min.
              </p>
              <div class="task-pills">
                <span class="task-pill-footer">Autocuidado</span>
                <span class="task-pill-footer">Leveza</span>
                <span class="task-pill-footer">Menos estresse</span>
              </div>
            </div>
          </div>
        </div>
      </label>

    </div>
  </main>



</body>
</html>
