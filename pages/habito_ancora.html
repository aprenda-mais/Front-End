<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hábito Âncora</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <!-- Fonte Plus Jakarta Sans -->
<link rel="stylesheet" href="../assets/css/habito_ancora.css">
</head>
<body>

    <!-- Logótipo / Marca -->
    <header class="header">
        <div class="logo">
            <!-- Ícone Âncora -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="2.5"></circle>
                <line x1="12" y1="7.5" x2="12" y2="21"></line>
                <line x1="8" y1="10.5" x2="16" y2="10.5"></line>
                <path d="M5 14a7 7 0 0 0 14 0"></path>
            </svg>
            <span>hábito âncora</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        <div class="intro">
            <h1 class="title">Quando você prefere<br>praticar?</h1>
            <p class="subtitle">Ligar uma micro-ação a algo que já faz no quotidiano torna a consistência natural.</p>
        </div>

        <form>
<div class="cards-grid">

  <!-- 1. Escovar os dentes -->
  <label class="card-item">
    <input type="radio" name="habito" value="teeth">
    <div class="task-card-teeth">
      <div class="teeth-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M10 3H8" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M14.5859 11.414L21.9999 4" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 21.9999L9 14.9999C10.857 13.1429 12.714 13.0099 14.571 11.3999L12.586 9.41395C12.3064 9.13424 12.116 8.77792 12.0388 8.39001C11.9617 8.00211 12.0013 7.60004 12.1526 7.23464C12.304 6.86924 12.5603 6.55691 12.8891 6.33714C13.2179 6.11738 13.6045 6.00003 14 5.99995C14 5.46951 14.2107 4.96081 14.5858 4.58573C14.9609 4.21066 15.4696 3.99995 16 3.99995C15.9999 3.6218 16.107 3.25138 16.3089 2.93164C16.5109 2.61191 16.7993 2.35597 17.1407 2.19351C17.4822 2.03104 17.8627 1.96871 18.2382 2.01375C18.6136 2.05878 18.9686 2.20934 19.262 2.44795L21.414 4.58595" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 15V19" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M22 17H18" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 5V9" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M6 7H2" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M9 2V4" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Escovar os dentes</h3>
    </div>
  </label>

  <!-- 2. Depois do primeiro café -->
  <label class="card-item">
    <input type="radio" name="habito" value="coffee">
    <div class="task-card-coffee">
      <div class="coffee-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M17 8H18C19.6569 8 21 9.34315 21 11C21 12.6569 19.6569 14 18 14H17" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 8H17V15C17 17.2091 15.2091 19 13 19H8C5.79086 19 4 17.2091 4 15V8Z" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 3V5" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 3V5" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 3V5" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Depois do primeiro café</h3>
    </div>
  </label>

  <!-- 3. Tomar banho -->
  <label class="card-item">
    <input type="radio" name="habito" value="bath">
    <div class="task-card-bath">
      <div class="bath-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 4H8C9.65685 4 11 5.34315 11 7V9" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M16.5 6.5C17.8807 7.88071 17.8807 10.1193 16.5 11.5L11.5 16.5C10.1193 17.8807 7.88071 17.8807 6.5 16.5L16.5 6.5Z" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 17V17.01" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M17 14V14.01" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 18V18.01" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M13 20V20.01" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Tomar banho</h3>
    </div>
  </label>

  <!-- 4. Ao preparar o almoço -->
  <label class="card-item">
    <input type="radio" name="habito" value="lunch">
    <div class="task-card-lunch">
      <div class="lunch-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M10 4H14" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M5 8V6C5 5.44772 5.44772 5 6 5H18C18.5523 5 19 5.44772 19 6V8" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 8H20" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M5 8V15C5 17.2091 6.79086 19 9 19H15C17.2091 19 19 17.2091 19 15V8" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M2 11H4" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 11H22" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Ao preparar o almoço</h3>
    </div>
  </label>

  <!-- 5. Antes de deitar na cama -->
  <label class="card-item">
    <input type="radio" name="habito" value="bed">
    <div class="task-card-bed">
      <div class="bed-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 19V7" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M21 19V13" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 15H21V19H3V15Z" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 11H12C14.2091 11 16 12.7909 16 15V15H3V11Z" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 11V9C7 7.89543 7.89543 7 9 7C10.1046 7 11 7.89543 11 9V11" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>Antes de deitar na cama</h3>
    </div>
  </label>

  <!-- 6. Outro hábito -->
  <label class="card-item">
    <input type="radio" name="habito" value="other">
    <div class="task-card-other">
      <div class="other-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 20H21" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round"/>
          <path d="M16.5 3.5C17.3284 2.67157 18.6716 2.67157 19.5 3.5C20.3284 4.32843 20.3284 5.67157 19.5 6.5L7 19L3 20L4 16L16.5 3.5Z" stroke="#D9F9E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h3>Outro hábito</h3>
    </div>
  </label>

</div>
        </form>
    </main>

    <!-- Botão Continuar -->
    <footer class="footer">
        <button type="button" class="btn-continue" onclick="window.location.href='trilha_inicial.html'">
            Continuar
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </footer>


</body>
</html>
