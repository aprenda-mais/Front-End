<link rel="stylesheet" href="../assets/css/pages/habito-ancora.css">
</head>
<body>

    <!-- Conteúdo Principal -->
    <main class="container-form card-form">

  <path d="M22 17H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M4 5V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M9 2V4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    </div>
  </label>

  <!-- 4. Ao preparar o almoço -->
  <label class="card-item">
    <input type="radio" name="habito" value="lunch">
    <div class="card-option">
      <div class="icon-card">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <path d="M2 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <input type="radio" name="habito" value="bed">
    <div class="card-option">

</svg>
      </div>

    </div>

  <!-- 6. Outro hábito -->
  <label class="card-item">
